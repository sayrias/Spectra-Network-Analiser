  <title id="title">SPECTRA 24 logo</title>
  <desc id="desc">Turuncu spektrum çizgisi ve radyo alan halkalarından oluşan SPECTRA 24 işareti.</desc>
  <defs>
    <linearGradient id="signal" x1="110" y1="420" x2="535" y2="190" gradientUnits="userSpaceOnUse">
