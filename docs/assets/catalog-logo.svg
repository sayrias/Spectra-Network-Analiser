    </filter>
  </defs>
  <circle cx="400" cy="280" r="156" fill="none" stroke="#ff8a32" stroke-width="9" opacity=".2"/>
  <circle cx="400" cy="280" r="104" fill="none" stroke="#ff8a32" stroke-width="9" opacity=".32"/>
