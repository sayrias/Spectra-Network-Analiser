<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
  <title id="title">SPECTRA 24 katalog bannerı</title>
  <desc id="desc">Koyu zemin üzerinde SPECTRA 24 adı, spektrum çizgisi ve radyo alan halkaları.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#171b22"/><stop offset="1" stop-color="#080b10"/></linearGradient>
    <linearGradient id="signal" x1="705" y1="370" x2="1280" y2="180" gradientUnits="userSpaceOnUse"><stop stop-color="#ff7a24"/><stop offset="1" stop-color="#ffd09a"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#303640" stroke-width="1"/></pattern>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1440" height="560" rx="38" fill="url(#bg)"/>
  <rect x="720" width="720" height="560" fill="url(#grid)" opacity=".38"/>
  <circle cx="1118" cy="278" r="196" fill="none" stroke="#ff8a32" stroke-width="2" opacity=".12"/>
  <circle cx="1118" cy="278" r="130" fill="none" stroke="#ff8a32" stroke-width="2" opacity=".2"/>
  <circle cx="1118" cy="278" r="66" fill="none" stroke="#ff8a32" stroke-width="2" opacity=".32"/>
  <path d="M782 327h88v-52h62v52h46V174h54v238h56v-85h76v-40h67v40h85" fill="none" stroke="url(#signal)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <rect x="68" y="82" width="52" height="7" rx="3.5" fill="#ff8a32"/>
  <text x="68" y="132" font-family="Arial, sans-serif" font-size="18" letter-spacing="6" fill="#ffad6b">RF FIELD STUDIO / 24</text>
  <text x="62" y="258" font-family="Arial, sans-serif" font-size="100" font-weight="700" letter-spacing="-3" fill="#fff4e8">SPECTRA 24</text>
  <text x="68" y="314" font-family="Arial, sans-serif" font-size="27" fill="#b9c1cd">2,4 GHz alanını görünür kılın.</text>
  <rect x="68" y="378" width="126" height="46" rx="23" fill="#ff8a32"/>
  <text x="131" y="408" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#17120e">v1.0.0</text>
  <rect x="208" y="378" width="204" height="46" rx="23" fill="#20262e" stroke="#3b4552"/>
  <text x="310" y="408" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#dce2ea">ESP32 + nRF24</text>
  <rect x="426" y="378" width="174" height="46" rx="23" fill="#20262e" stroke="#3b4552"/>
  <text x="513" y="408" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#dce2ea">Wi-Fi + BLE</text>
</svg>
