<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
  <title id="title">SPECTRA katalog bannerı</title>
  <desc id="desc">Ortalanmış SPECTRA başlığı, spektrum çizgisi ve radyo alan halkaları.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#171b22"/><stop offset="1" stop-color="#080b10"/></linearGradient>
    <linearGradient id="signal" x1="150" y1="390" x2="1290" y2="230" gradientUnits="userSpaceOnUse"><stop stop-color="#ff7a24"/><stop offset=".5" stop-color="#ffd09a"/><stop offset="1" stop-color="#ff7a24"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#ff8a32" stop-opacity=".15"/><stop offset="1" stop-color="#ff8a32" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#303640" stroke-width="1"/></pattern>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1440" height="560" rx="38" fill="url(#bg)"/>
  <rect width="1440" height="560" rx="38" fill="url(#grid)" opacity=".28"/>
  <circle cx="720" cy="280" r="248" fill="url(#halo)"/>
  <circle cx="720" cy="280" r="204" fill="none" stroke="#ff8a32" stroke-width="2" opacity=".11"/>
  <circle cx="720" cy="280" r="138" fill="none" stroke="#ff8a32" stroke-width="2" opacity=".17"/>
  <circle cx="720" cy="280" r="72" fill="none" stroke="#ff8a32" stroke-width="2" opacity=".25"/>
  <path d="M132 385h121v-40h76v40h58v-88h60v88h85v-134h62v134h71v-55h72v55h70v-105h62v105h72v-66h66v66h121" fill="none" stroke="url(#signal)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity=".78" filter="url(#glow)"/>
  <text x="720" y="323" text-anchor="middle" font-family="Arial, sans-serif" font-size="142" font-weight="700" letter-spacing="-5" fill="#fff4e8">SPECTRA</text>
</svg>
